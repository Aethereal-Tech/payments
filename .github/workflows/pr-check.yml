name: PR Check

# The same build a release runs, minus the publishing. If this is red, master would be too.
on:
  pull_request:
    branches: [master]
  workflow_dispatch:

# A superseded run on a pull request is pure waste — the next push supersedes its verdict anyway.
concurrency:
  group: pr-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v5

      - name: Setup JDK
        uses: actions/setup-java@v5
        with:
          java-version: '25'
          distribution: 'temurin'
          cache: 'maven'

      # `verify`, not `test`, because the JaCoCo coverage gate binds to the verify phase. Running
      # tests alone would report green on a change that drops coverage below the floor.
      - name: Verify
        run: ./mvnw --batch-mode clean verify

      # One artifact per module, not one merged report. A merged number would let a well-tested
      # module carry an untested one past a floor that each module's own pom sets separately.
      - name: Publish coverage reports
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: jacoco-reports
          path: |
            payments-core/target/site/jacoco/
            payments-bankart/target/site/jacoco/
            payments-agentaos/target/site/jacoco/
          if-no-files-found: warn
